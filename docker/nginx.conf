# Upstream API goes to the collector; everything else is the static UI.
upstream collector {
    server collector:8792;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache-bust the dashboard: it polls /api/* at 1 Hz anyway.
    add_header Cache-Control "no-store" always;

    location /api/ {
        proxy_pass http://collector:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 65s;   # /api/stream is a long-lived SSE feed
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
