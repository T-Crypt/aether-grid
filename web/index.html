<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEX-LAB — Runtime Field Monitor</title>
<meta name="description" content="HEX-LAB static clone: status pills, brainwave terrain, helix reasoning, cohort KV grid. No build.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='none' stroke='%235fd6ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%235fd6ff'/%3E%3C/svg%3E">
<script>
(function(){function show(m){var d=document.getElementById('js-err');if(!d){d=document.createElement('pre');d.id='js-err';(document.body||document.documentElement).appendChild(d);}d.textContent+=m+'\n';}
addEventListener('error',function(e){show('error: '+e.message);});
addEventListener('unhandledrejection',function(e){var r=e.reason;show('rejection: '+(r&&r.stack?r.stack:r));});})();
</script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
  <header class="pills" id="pills" aria-label="Status pills"></header>
  <main class="deck">
    <section class="panel span-12" aria-label="Key metrics"><h2>Key metrics</h2><div class="kpis" id="kpis"></div></section>
    <section class="panel span-7" aria-label="Brainwave terrain"><h2>Brainwave terrain</h2><canvas class="field" id="terrain" height="220"></canvas></section>
    <section class="panel span-5" aria-label="Helix reasoning"><h2>Helix reasoning</h2><canvas class="field" id="helix" height="220"></canvas></section>
    <section class="panel span-12" aria-label="Field layers"><h2>Field layers</h2>
      <div style="display:flex;gap:1.25rem;flex-wrap:wrap;margin-bottom:.5rem;font-size:.85em">
        <label><input type="checkbox" id="tgl-declination" checked> declination</label>
        <label><input type="checkbox" id="tgl-scope" checked> scope-omega</label>
        <label><input type="checkbox" id="tgl-loom" checked> loom-9</label>
        <label><input type="checkbox" id="tgl-safehouse" checked> safehouse</label>
      </div>
      <h3>Declination · backdrop</h3><canvas class="field" id="backdrop" height="160"></canvas>
      <h3>Scope-omega · scatter</h3><canvas class="field" id="scatter" height="160"></canvas>
      <h3>Loom-9 · cables</h3><canvas class="field" id="cables" height="160"></canvas>
      <h3>Safehouse · scope</h3><canvas class="field" id="scope" height="160"></canvas>
    </section>
    <section class="panel span-12" aria-label="Cohort KV slots"><h2>Cohort grid · KV slots</h2><div class="cohort" id="cohort"></div></section>
    <section class="panel span-8" aria-label="Events"><h2>Events</h2><ul class="log" id="events"></ul></section>
    <section class="panel span-4" aria-label="Requests"><h2>Requests</h2><ul class="log" id="requests"></ul></section>
  </main>
  <footer class="foot" id="foot"></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
