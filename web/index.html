<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Grid | Hex-Lab</title>
<meta name="description" content="Aether Grid field monitor: status pills, brainwave terrain, helix reasoning, cohort grid. No build.">
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 25H28' stroke='%23647294' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M6 10.5A13.5 13.5 0 0 1 26 10.5' fill='none' stroke='%238f7bff' stroke-width='1.5' stroke-linecap='round' opacity='.55'/%3E%3Cpath d='M9.5 14.5A9 9 0 0 1 22.5 14.5' fill='none' stroke='%238f7bff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='19' r='3' fill='%238f7bff'/%3E%3C/svg%3E">
<script>
try{document.documentElement.dataset.skin=localStorage.getItem('aether.skin')||'aether';}catch(e){}
</script>
<script>
(function(){function show(m){var d=document.getElementById('js-err');if(!d){d=document.createElement('pre');d.id='js-err';(document.body||document.documentElement).appendChild(d);}d.textContent+=m+'\n';}
addEventListener('error',function(e){show('error: '+e.message);});
addEventListener('unhandledrejection',function(e){var r=e.reason;show('rejection: '+(r&&r.stack?r.stack:r));});})();
</script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#n)" opacity="0.6"/></svg></div>
  <header class="pills" id="pills" aria-label="Status pills"></header>
  <div class="timecode-bar" id="timecode" aria-label="Timecode strip"></div>
  <main class="deck">
    <section class="panel p-kpis" aria-label="Key metrics"><div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br-c"></div><h2>[ KEY METRICS ]</h2><span class="bp-rlabel">RET</span><span class="br-id tl">[ +1 ]</span><span class="br-id tr">[ R1 ]</span><div class="kpis" id="kpis" style="padding-top:14px"></div><div class="meta-strip" id="kpi-meta"></div></section>
    <section class="panel p-terrain" aria-label="Brainwave terrain"><div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br-c"></div><h2>[ 4_CKS / CTX ]</h2><span class="bp-rlabel">RET</span><span class="br-id tl">[ +1 ]</span><span class="br-id br-c">[ A4 ]</span><div class="panel-body"><canvas class="field" id="terrain" height="220"></canvas><div class="meta-strip" id="terrain-meta"></div></div></section>
    <section class="panel cool p-helix" aria-label="Helix reasoning"><div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br-c"></div><h2>[ SHE_10N / DEV ]</h2><span class="bp-rlabel">DEV</span><span class="br-id tl">[ +2 ]</span><span class="br-id br-c">[ B2 ]</span><div class="panel-body"><canvas class="field" id="helix" height="220"></canvas><div class="meta-strip" id="helix-meta"></div></div></section>
    <section class="panel data p-gauges" aria-label="Gauges"><div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br-c"></div><h2>[ TEMP / PSI ]</h2><span class="bp-rlabel">DEV</span><div class="panel-body"><canvas class="field" id="gauges" height="220" style="height:170px"></canvas><div class="meta-strip" id="gauge-meta"></div></div></section>
    <section class="panel p-field" aria-label="Field layers"><div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br-c"></div><h2>[ FIELD LAYERS ]</h2><span class="bp-rlabel">TR1</span>
      <div class="toggles panel-body" style="flex:none">
        <label><input type="checkbox" id="tgl-declination" checked> declination</label>
        <label><input type="checkbox" id="tgl-scope" checked> scope-omega</label>
        <label><input type="checkbox" id="tgl-loom" checked> loom-9</label>
        <label><input type="checkbox" id="tgl-safehouse" checked> safehouse</label>
        <span class="seg" role="group" aria-label="Interface skin"><span class="seg-k">skin</span><button type="button" data-skin-btn="aether" aria-pressed="true">aether</button><button type="button" data-skin-btn="hexlab" aria-pressed="false">hex-lab</button></span>
      </div>
      <div class="layer-row"><h3><b>DECLINATION</b> · BACKDROP</h3><canvas class="field short" id="backdrop" height="150"></canvas></div>
      <div class="layer-row"><h3><b>SCOPE-OMEGA</b> · SCATTER</h3><canvas class="field short" id="scatter" height="150"></canvas></div>
      <div class="layer-row"><h3><b>LOOM-9</b> · CABLES</h3><canvas class="field short" id="cables" height="150"></canvas></div>
      <div class="layer-row"><h3><b>SAFEHOUSE</b> · SCOPE</h3><canvas class="field short" id="scope" height="150"></canvas></div>
    </section>
    <section class="panel p-cohort" aria-label="Cohort grid"><div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br-c"></div><h2>[ COHORT / KV ]</h2><span class="bp-rlabel">GL_OV3R</span><div class="cohort" id="cohort" style="padding-top:14px"></div><div class="meta-strip" id="cohort-meta"></div></section>
    <section class="panel p-events" aria-label="Events"><div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br-c"></div><h2>[ LOG / EXP ]</h2><span class="bp-rlabel">EXP</span><div class="panel-body"><ul class="log" id="events"></ul><ul class="log" id="requests" style="margin-top:8px"></ul></div></section>
  </main>
  <div class="data-band" id="databand" aria-label="Data band"></div>
  <footer class="foot" id="foot"></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
